# Temporary: the x64 branch built and booted the way release.yml does, without publishing anything.
name: x64 check

on:
  push:
    branches: [x64]

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04   # (ubuntu-latest moved to 26.04 and GCC 15)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build number is the commit count

      - name: Install the toolchain and ISO tools
        timeout-minutes: 25
        run: |
          # (the runners' own package mirror stalls at times: Ubuntu's main one, and each try cut short)
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99retry
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for i in 1 2 3; do
            timeout 420 sh -c 'sudo apt-get update -q && sudo apt-get install -y -q gcc-multilib g++-multilib grub-pc-bin grub-common xorriso mtools qemu-system-x86' && break
            echo "try $i stalled; again"
          done

      - name: Build tOS.iso
        # from scratch: objects must never come from the checkout
        run: |
          make clean
          make -j"$(nproc)" kernel/tOS.elf
          make tOS.iso
          ls -la tOS.iso kernel/tOS.elf

      - uses: actions/upload-artifact@v4
        with:
          name: x64-build
          path: |
            tOS.iso
            kernel/tOS.elf
            kernel/tOS64.elf
            initrd.tar

      - name: Boot it in QEMU
        # A release that cannot boot is worse than no release: the ISO is published only after
        # the kernel has come up through memory, the file systems and the drivers, shown its boot
        # screen and opened tOS Recovery (an empty disk: nothing is installed yet).
        run: |
          truncate -s 64M disk.img
          timeout 90 qemu-system-x86_64 -cdrom tOS.iso -m 1024 -boot d -vga std \
              -drive file=disk.img,if=ide,format=raw \
              -display none -serial stdio -no-reboot > boot.log 2>&1 || true
          tr -d '\r' < boot.log | tail -60
          grep -q "Paging enabled"       boot.log
          grep -q "VFS initialized"      boot.log
          grep -q "Keyboard initialized" boot.log
          grep -q "session: recovery"    boot.log

      - name: Check the kernel can be started by Software Update
        # The old system reads the new kernel into its heap, which begins where the old kernel ends.
        # Builds 583 to 588 end near 0x20597000, and when a staged update is installed at start-up
        # the copy sits right there: build 589, 3.5 MB bigger with the boot animation inside it, was
        # written to the disk but could not be started ("the new image overlaps its own source").
        # Large data goes into the initrd; the kernel may only grow a little past 0x20597000.
        run: |
          python3 - <<'PY'
          import subprocess, sys
          end = 0
          for line in subprocess.check_output(['readelf', '-lW', 'kernel/tOS.elf'], text=True).splitlines():
              f = line.split()
              if f and f[0] == 'LOAD':
                  end = max(end, int(f[3], 16) + int(f[5], 16))
          print('kernel ends at 0x%X' % end)
          sys.exit(0 if end <= 0x205A0000 else 'the kernel ends past 0x205A0000: older builds could not restart into it')
          PY


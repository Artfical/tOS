# Every push to main is built from a clean tree, booted in QEMU, and published as a release
# called "build @<commit>" with tOS.iso attached, so any commit can be tried in QEMU, VMware
# or VirtualBox, or written to a USB stick, without building anything locally.

name: build iso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain and ISO tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib g++-multilib grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build tOS.iso
        # from scratch: objects must never come from the checkout
        run: |
          make clean
          make -j"$(nproc)" kernel/tOS.elf
          make tOS.iso
          ls -la tOS.iso kernel/tOS.elf

      - name: Boot it in QEMU
        # A release that cannot boot is worse than no release: the ISO is published only after
        # the kernel has come up through memory, the file systems and the drivers to the first
        # question it asks, and has answered it.
        run: |
          truncate -s 64M disk.img
          ( sleep 25; printf '1'; sleep 3; printf 'n\n'; sleep 10 ) | \
            timeout 60 qemu-system-i386 -cdrom tOS.iso -m 1024 -boot d \
              -drive file=disk.img,if=ide,format=raw \
              -display none -serial stdio -no-reboot > boot.log 2>&1 || true
          cat boot.log | tr -d '\r' | tail -60
          grep -q "Paging enabled"       boot.log
          grep -q "VFS initialized"      boot.log
          grep -q "Keyboard initialized" boot.log
          grep -q "Keyboard layout"      boot.log

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          cp tOS.iso "tOS-$SHORT.iso"
          gh release create "build-$SHORT" \
             --title "build @$SHORT" \
             --notes "$SUBJECT

          Boot it in QEMU with:
          \`\`\`
          qemu-system-i386 -cdrom tOS-$SHORT.iso -m 1024 -vga std
          \`\`\`
          or attach it to a VMware / VirtualBox machine as a CD (BIOS boot), or write it to a USB stick." \
             "tOS-$SHORT.iso" \
             "kernel/tOS.elf"

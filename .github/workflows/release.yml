# Every push to main is built from a clean tree, booted in QEMU, and published as a release
# called "build @<commit>" with tOS.iso attached, so any commit can be tried in QEMU, VMware
# or VirtualBox, or written to a USB stick, without building anything locally.

name: build iso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build number is the commit count

      - name: Install the toolchain and ISO tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-multilib g++-multilib grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build tOS.iso
        # from scratch: objects must never come from the checkout
        run: |
          make clean
          make -j"$(nproc)" kernel/tOS.elf
          make tOS.iso
          ls -la tOS.iso kernel/tOS.elf

      - name: Boot it in QEMU
        # A release that cannot boot is worse than no release: the ISO is published only after
        # the kernel has come up through memory, the file systems and the drivers, shown its boot
        # screen and opened tOS Recovery (an empty disk: nothing is installed yet).
        run: |
          truncate -s 64M disk.img
          timeout 90 qemu-system-i386 -cdrom tOS.iso -m 1024 -boot d -vga std \
              -drive file=disk.img,if=ide,format=raw \
              -display none -serial stdio -no-reboot > boot.log 2>&1 || true
          tr -d '\r' < boot.log | tail -60
          grep -q "Paging enabled"       boot.log
          grep -q "VFS initialized"      boot.log
          grep -q "Keyboard initialized" boot.log
          grep -q "session: recovery"    boot.log

      - name: Describe the update
        # what update.artfical.com publishes: the build number, the commit, what it says and
        # which files it touched (the release notes are made from these), and the files' hashes
        run: |
          python3 - <<'PY'
          import json, hashlib, subprocess, os
          def git(*a): return subprocess.check_output(['git', *a], text=True).strip()
          def sha(p): return hashlib.sha256(open(p, 'rb').read()).hexdigest()
          m = {
            'build': int(git('rev-list', '--count', 'HEAD')),
            'commit': git('rev-parse', 'HEAD'),
            'short': git('rev-parse', '--short', 'HEAD'),
            'date': git('log', '-1', '--format=%cI'),
            'subject': git('log', '-1', '--format=%s'),
            'body': git('log', '-1', '--format=%b'),
            'files': git('diff', '--name-only', 'HEAD~1', 'HEAD').splitlines(),
            # the release notes are written by hand in UPDATE_NOTES.md, with the commit they belong to
            'notes': open('UPDATE_NOTES.md').read() if 'UPDATE_NOTES.md' in git('diff', '--name-only', 'HEAD~1', 'HEAD').splitlines() else None,
            'kernel': {'name': 'tOS.elf', 'size': os.path.getsize('kernel/tOS.elf'), 'sha256': sha('kernel/tOS.elf')},
            'initrd': {'name': 'initrd.tar', 'size': os.path.getsize('initrd.tar'), 'sha256': sha('initrd.tar')},
          }
          json.dump(m, open('manifest.json', 'w'), indent=1)
          print(json.dumps({k: m[k] for k in ('build', 'short', 'subject')}))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          cp tOS.iso "tOS-$SHORT.iso"
          gh release create "build-$SHORT" \
             --title "build @$SHORT" \
             --notes "$SUBJECT

          Boot it in QEMU with:
          \`\`\`
          qemu-system-i386 -cdrom tOS-$SHORT.iso -m 1024 -vga std
          \`\`\`
          or attach it to a VMware / VirtualBox machine as a CD (BIOS boot), or write it to a USB stick.
          Installed systems get it through Software Update (update.artfical.com)." \
             "tOS-$SHORT.iso" \
             "kernel/tOS.elf" \
             "initrd.tar" \
             "manifest.json"
